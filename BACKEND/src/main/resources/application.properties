spring.application.name=pcbxpress-erp


server.port=8080
server.servlet.context-path=/api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pcbxpress
spring.datasource.username=postgres
spring.datasource.password=3710

# JPA - Schema management DISABLED (database schema is pre-configured)
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
# Use a strong Base64-encoded secret in real environments; this is just a placeholder
security.jwt.secret=VGhpcy1pcy1hLXZlcnktbG9uZy1kZW1vLXNlY3JldC1rZXktZm9yLXBjYnhwcmVzcw==
security.jwt.access-token.expiration-minutes=120
security.jwt.refresh-token.expiration-days=7
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter=DEBUG
logging.level.com.pcbxpress=DEBUG
